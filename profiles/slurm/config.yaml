##############################################################################
# profiles/slurm/config.yaml
##############################################################################

cluster:
  mkdir -p {resources.slurm_log_dir} &&
  sbatch
    --job-name={rule}
    --mail-user={config[cluster][email]}
    --cpus-per-task={threads}
    --mem={resources.mem_gb}G
    --time={resources.time}
    --nodes=1
    --partition={resources.partition}
    --account={resources.account}
    --gpus={resources.gpus}
    --output={resources.slurm_log_dir}/{rule}.out
    --error={resources.slurm_log_dir}/{rule}.err
    --parsable

cluster-status: slurm-status.py

conda-prefix: .snakemake/conda

jobs: 50
latency-wait: 60
local-cores: 1
restart-times: 1
max-jobs-per-second: 100
max-status-checks-per-second: 20
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy

use-conda: True
conda-frontend: conda
use-singularity: True
singularity-prefix: .snakemake/singularity

# Container bind mounts are derived from your config paths automatically.
# Add extras here if needed, e.g.:
# singularity-args: "--bind /path/to/shared/storage"

default-resources:
  mem_gb: 400
  time: "'2-00:00:00'"
  partition: "'high'"
  account: "'genome-center-grp'"
  slurm_log_dir: "'slurm_logs'"
  tmpdir: "'/tmp'"
  gpus: 0